# Mantem os projetos Supabase "listajota" e "listafnc" ativos.
# O plano gratuito pausa o projeto apos ~7 dias sem atividade; este job faz
# uma consulta leve no banco a cada 2 dias para evitar a pausa.
# As chaves usadas sao as publishable (publicas por design).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */2 * *" # a cada 2 dias, 12:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: listajota
            url: https://psspiwoxfapkghavdodi.supabase.co
            chave: sb_publishable_09JkNt0mmCBJWUn--t6NFw_DvIN9bi1
          - nome: listafnc
            url: https://syikoanvfyhzyefptbtn.supabase.co
            chave: sb_publishable_ftY-qFYAz4bQ8QxVTCHfhw_KweqVk-_
    steps:
      - name: Ping no banco (${{ matrix.nome }})
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ matrix.url }}/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: ${{ matrix.chave }}")
          echo "${{ matrix.nome }}: HTTP $status"
          if [ "$status" -ge 400 ]; then exit 1; fi
