# Mantem o projeto Supabase "listajota" ativo.
# O plano gratuito pausa o projeto apos ~7 dias sem atividade; este job faz
# uma consulta leve no banco a cada 2 dias para evitar a pausa.
# A chave usada e a publishable (publica por design, ja esta em supabase-config.js).
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */2 * *" # a cada 2 dias, 12:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no banco
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://psspiwoxfapkghavdodi.supabase.co/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: sb_publishable_09JkNt0mmCBJWUn--t6NFw_DvIN9bi1")
          echo "HTTP $status"
          if [ "$status" -ge 400 ]; then exit 1; fi
